<style>
:root{--bg:#0D0D0F;--card:#1A1A1E;--gold:#E0B94A;--txt:#F5F5F5;--mut:#A9A9B0;--line:rgba(224,185,74,.25)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}
section{padding:72px 0}
h1,h2,h3{line-height:1.2}
h2{font-size:clamp(1.7rem,4.5vw,2.5rem);font-weight:800;color:var(--gold);margin-bottom:14px}
.sub{color:var(--mut);max-width:640px;margin-bottom:36px;font-size:1.05rem}
.badge{display:inline-block;border:1px solid var(--line);color:var(--gold);border-radius:99px;padding:5px 14px;font-size:.8rem;font-weight:600;margin-bottom:18px}
nav{position:sticky;top:0;z-index:50;background:rgba(13,13,15,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.04em;color:var(--txt);text-decoration:none}
.brand img{width:34px;height:34px;border-radius:8px}
.links{display:flex;gap:24px;align-items:center}
.links a{color:var(--mut);text-decoration:none;font-weight:500;font-size:.95rem}
.links a:hover{color:var(--gold)}
.btn{display:inline-block;background:var(--gold);color:#0D0D0F;font-weight:700;border:0;border-radius:99px;padding:14px 28px;font-size:1rem;cursor:pointer;text-decoration:none;font-family:inherit}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--txt);border:1.5px solid var(--line)}
.btn.sm{padding:10px 20px;font-size:.9rem}
.hero{padding:90px 0 70px;text-align:center;background:radial-gradient(circle at 70% 0,#1d1606,var(--bg) 60%)}
.hero h1{font-size:clamp(2.1rem,6vw,3.8rem);font-weight:800;margin-bottom:20px}
.hero h1 span{color:var(--gold)}
.hero p{color:var(--mut);font-size:1.15rem;max-width:620px;margin:0 auto 30px}
.cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px}
.card h3{margin-bottom:8px;font-size:1.15rem}
.card p{color:var(--mut)}
.ico{font-size:1.8rem;margin-bottom:12px}
.step b{display:block;font-size:2.4rem;color:var(--gold);line-height:1;margin-bottom:8px}
.price{display:flex;flex-direction:column;position:relative}
.price.pop{border-color:var(--gold);box-shadow:0 0 24px rgba(224,185,74,.18)}
.tag{position:absolute;top:-12px;right:20px;background:var(--gold);color:#0D0D0F;font-size:.72rem;font-weight:700;padding:4px 12px;border-radius:99px}
.amount{font-size:2.4rem;font-weight:800;margin:10px 0}
.amount small{font-size:1rem;font-weight:500;color:var(--mut)}
.price ul{list-style:none;margin:8px 0 22px;flex-grow:1}
.price li{padding:7px 0 7px 26px;position:relative;color:#DCDCE0}
.price li:before{content:"✓";position:absolute;left:0;color:var(--gold);font-weight:700}
.extras{margin-top:26px}
.extras .card{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 22px}
.extras strong{color:var(--gold);white-space:nowrap}
.note{color:var(--mut);font-size:.85rem;margin-top:18px;text-align:center}
.offer{background:linear-gradient(135deg,#241b06,var(--card));border:1px solid var(--gold);border-radius:26px;padding:34px;text-align:center}
.offer h2{margin-bottom:10px}
.offer p{color:#DCDCE0;margin-bottom:22px}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 22px;margin-bottom:12px}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::after{content:"+";color:var(--gold);font-size:1.3rem;line-height:1}
details[open] summary::after{content:"–"}
details p{color:var(--mut);margin-top:12px}
form{display:grid;gap:14px;max-width:520px;margin:0 auto}
input,select{width:100%;padding:14px 20px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit}
input:focus,select:focus{outline:2px solid var(--gold);border-color:transparent}
footer{border-top:1px solid var(--line);padding:36px 0 90px;text-align:center;color:var(--mut);font-size:.9rem}
footer a{color:var(--gold);text-decoration:none}
.wa{position:fixed;right:20px;bottom:20px;z-index:60;width:58px;height:58px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.4);border:0;cursor:pointer}
.wa svg{width:30px;height:30px;fill:#fff}
@media(max-width:700px){.links a{display:none}section{padding:56px 0}.extras .card{flex-direction:column;align-items:flex-start}}

h1,h2,.amount,.step b{font-family:"Playfair Display",Georgia,serif}
h2{letter-spacing:-.01em}
.badge{display:block;color:var(--gold);font-size:.75rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;margin-bottom:18px;border:0;padding:0}
.badge::before{content:"";display:inline-block;width:28px;height:1px;background:var(--gold);vertical-align:middle;margin-right:12px}
.btn{background:linear-gradient(135deg,#F2D77F,#D2A63A);box-shadow:0 8px 24px rgba(224,185,74,.22);letter-spacing:.02em}
.btn.ghost{background:transparent;box-shadow:none}
.mark{width:68px;height:68px;margin:0 auto 24px;display:block;border-radius:16px;border:1px solid var(--line)}
.hero h1{font-weight:700}
.trust{display:flex;gap:10px 26px;justify-content:center;flex-wrap:wrap;margin-top:34px;color:var(--mut);font-size:.85rem;letter-spacing:.06em}
.trust span::before{content:"◆";color:var(--gold);margin-right:8px;font-size:.6rem;vertical-align:middle}
.i{width:34px;height:34px;fill:none;stroke:var(--gold);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;margin-bottom:16px}
.card{border-radius:18px;transition:border-color .3s}
.card:hover{border-color:var(--gold)}
.shot{padding:12px}.shot img{width:100%;height:auto;aspect-ratio:4/5;display:block;border-radius:10px}
.shot figcaption{color:var(--mut);font-size:.85rem;margin-top:10px;text-align:center;letter-spacing:.04em}
.ex{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.price.pop{background:linear-gradient(180deg,#221b09,var(--card))}
.price li{font-size:.95rem}
.js .rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.js .rv.in{opacity:1;transform:none}
</style>
</head>
